name: Bug report
description: Report a reproducible TRO.Y 2 integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove controller IP addresses and other private information before submitting logs.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
